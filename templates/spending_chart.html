<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spending Charts - Financial Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">FinanceHub</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('add_expense') }}">Add Expense</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('view_transactions') }}">Transactions</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('view_documents') }}">Documents</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Your Spending Charts</h2>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Spending by Category</h5>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Spending Distribution</h5>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('/api/expense_data');
            const data = await res.json();
            return data;
        }

        function renderCharts(data) {
            const ctxBar = document.getElementById('barChart').getContext('2d');
            const ctxPie = document.getElementById('pieChart').getContext('2d');

            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: data.categories,
                    datasets: [{
                        label: 'Amount',
                        data: data.values,
                        backgroundColor: 'rgba(102,125,234,0.8)'
                    }]
                },
                options: { indexAxis: 'y' }
            });

            new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: data.categories,
                    datasets: [{
                        data: data.values,
                        backgroundColor: [
                            '#667eea','#764ba2','#48dbfb','#ff6b6b','#ffa502','#2ecc71','#9b59b6'
                        ]
                    }]
                }
            });
        }

        (async () => {
            const d = await loadData();
            if (d && d.categories && d.categories.length) renderCharts(d);
            else document.body.insertAdjacentHTML('beforeend','<div class="container mt-4"><div class="alert alert-info">No transaction data available for charts.</div></div>');
        })();
    </script>
</body>
</html>
