<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">FinanceHub</a>
  </div>
</nav>
<div class="container mt-4">
    <h3>View Expense</h3>
    <div class="card">
        <div class="card-body">
            <p><strong>Date:</strong> {{ expense.date }}</p>
            <p><strong>Category:</strong> {{ expense.category }}</p>
            <p><strong>Amount:</strong> ₹{{ "%.2f"|format(expense.amount) }}</p>
            <p><strong>Description:</strong> {{ expense.description or '-' }}</p>
            <a href="{{ url_for('edit_expense', expense_id=expense.id) }}" class="btn btn-primary">Edit</a>
            <a href="{{ url_for('view_transactions') }}" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>
</body>
</html>
